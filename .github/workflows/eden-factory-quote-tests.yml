name: Eden Universal AI Factory Quote Tests
on:
  pull_request:
    paths:
      - 'independent-launch-engine/eden-factory/**'
      - '.github/workflows/eden-factory-quote-tests.yml'
  push:
    branches:
      - 'feature/eden-universal-ai-factory-v1'
    paths:
      - 'independent-launch-engine/eden-factory/**'
      - '.github/workflows/eden-factory-quote-tests.yml'
permissions:
  contents: read
jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Execute deterministic quote tests
        run: node --test independent-launch-engine/eden-factory/tests/quote-engine.test.mjs
      - name: Check schema-agnostic demo assets
        run: |
          test -f independent-launch-engine/eden-factory/demo/index.html
          test -f independent-launch-engine/eden-factory/src/quote-engine.mjs
          test -f independent-launch-engine/eden-factory/src/service-catalog.mjs
