name: Factory Domain Policy Tests
on:
  pull_request:
    paths:
      - 'src/lib/factoryDomainPolicy.mjs'
      - 'scripts/factory-domain-policy.test.mjs'
      - '.github/workflows/factory-domain-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify domain isolation and indexing gates
        run: node --test scripts/factory-domain-policy.test.mjs
