name: Independent Industry Image Evidence Gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  image-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit both homepage and site-builder industry images
        run: |
          set +e
          node scripts/independent-image-evidence-gate.mjs
          catalog_status=$?
          node scripts/independent-homepage-image-gate.mjs
          homepage_status=$?
          if [ "$catalog_status" -ne 0 ] || [ "$homepage_status" -ne 0 ]; then
            exit 1
          fi
