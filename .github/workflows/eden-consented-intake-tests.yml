name: Eden Progressive Onboarding Security Tests
on:
  push:
    branches:
      - feature/eden-consented-discovery-v2
    paths:
      - 'independent-launch-engine/eden-factory/**'
      - '.github/workflows/eden-consented-intake-tests.yml'
  pull_request:
    paths:
      - 'independent-launch-engine/eden-factory/**'
      - '.github/workflows/eden-consented-intake-tests.yml'
permissions:
  contents: read
jobs:
  security-and-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run deterministic quote engine tests
        run: node --test independent-launch-engine/eden-factory/tests/quote-engine.test.mjs
      - name: Run eight-step intake and authorized research tests
        run: node --test independent-launch-engine/eden-factory/onboarding/tests/intake.test.mjs
      - name: Verify guarded Xtreme browser execution bridge
        run: node --test independent-launch-engine/eden-factory/onboarding/tests/browser-bridge.test.mjs
      - name: Verify interactive portal assets and restricted dependencies
        shell: bash
        run: |
          test -f independent-launch-engine/eden-factory/onboarding/index.html
          test -f independent-launch-engine/eden-factory/onboarding/intake-engine.mjs
          test -f independent-launch-engine/eden-factory/onboarding/business-research-policy.mjs
          ! grep -i -E 'base44Client|browserbase' independent-launch-engine/eden-factory/onboarding/*.mjs
