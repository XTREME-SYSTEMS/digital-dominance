name: Digital Dominance Voice Bridge
on:
  pull_request:
    paths:
      - 'railway/voice-bridge/**'
      - '.github/workflows/digital-dominance-voice-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-and-voice-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: railway/voice-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Node source
        run: |
          node --check core.mjs
          node --check security.mjs
          node --check server.mjs
      - name: Run synthetic voice contract tests
        run: npm test
      - name: Verify dependency install and entry point
        run: |
          npm install --ignore-scripts --no-audit
          node -e "import('ws').then(()=>console.log('ws dependency resolves'))"
